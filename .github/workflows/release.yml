# Merging main into the `release` branch builds the installers and publishes them as a new GitHub
# Release; the version comes from scripts/next-version.mjs. A pull request into `release` runs the
# same build without publishing, and shows the version it would release.
name: Release

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

permissions:
  contents: read

# Unlike the default shell, `bash` fails a step when any command in a pipe fails.
defaults:
  run:
    shell: bash

# One at a time, so two merges can't work out the same version.
concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # A squash or rebase would hide main's commits from the version bump, now and in the next
      # release, and a published version can't be replaced. So nothing else gets released.
      - name: Check this is a merge from main
        if: github.event_name == 'push'
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then exit 0; fi
          if git rev-parse --verify --quiet HEAD^2 >/dev/null && git merge-base --is-ancestor HEAD^2 origin/main; then exit 0; fi
          echo "::error::release only takes merges from main (a merge commit, not a squash or rebase, and no direct commits)"
          exit 1
      - name: Work out the next version
        id: next
        run: |
          output=$(node scripts/next-version.mjs)
          echo "$output" | tee -a "$GITHUB_OUTPUT"
          echo "Next version: ${output#version=}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    if: needs.version.outputs.version
    strategy:
      fail-fast: false
      matrix:
        # Add a row to build for another platform (and its target flags).
        include:
          - name: macos
            runner: macos-latest
            flags: --mac dmg zip --arm64 --x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The version lives in the tags, not in a commit, so main and release never diverge over it.
      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - run: npm run build
      - name: Prepare Apple notarization key
        if: github.event_name == 'push'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Build release candidate
        if: github.event_name == 'pull_request'
        run: npx electron-builder ${{ matrix.flags }} --publish never --config.mac.identity=- --config.mac.hardenedRuntime=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Build and notarize release
        if: github.event_name == 'push'
        run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Check the app's signature, version and launch
        if: matrix.name == 'macos'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app=release/mac-arm64/gh-ui.app
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$VERSION"
          GH_UI_SMOKE_TEST=1 perl -e 'alarm 120; exec @ARGV' "$app/Contents/MacOS/gh-ui" | tee smoke.json
          grep -q '"ok":true' smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  publish:
    needs: [version, build]
    if: github.event_name == 'push' && needs.version.outputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          # Re-running an old run must not publish old code after a newer merge; the newer run releases it too.
          tip=$(gh api "repos/$GH_REPO/git/ref/heads/release" --jq .object.sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::release has moved on to $tip since this run"
            exit 1
          fi
          # A published version is never replaced.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already released"
            exit 1
          fi
          gh release create "$TAG" installers/* --title "GitHub UI $TAG" --target "$GITHUB_SHA" --generate-notes --latest
